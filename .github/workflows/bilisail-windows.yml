name: BiliSail Windows LGPL SDK

on:
  push:
    branches: [codex/windows-hwdec-plane-bounds]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ghcr.io/btbn/ffmpeg-builds/win64-lgpl@sha256:291298c28290ea30b94a224cb2545d1f2df922fe9445d1866036eabbeb246a3f
    env:
      FFMPEG_REF: 615b07170e30d79ad5906418ea49f81c3cbd8457
      LUAJIT_REF: ea9eb7edb5eac4a9d175d74523db34fac0fa5180
      SIXEL_REF: 3c9fd6a294b2d0338482f9a5d5772827d82cfa9d
      SUBRANDR_REF: a41311bb5e382abcc47ef141e2ea1098d22a8d58
      BILISAIL_WINDOWS_ANGLE: '1'
      WINEPREFIX: /tmp/wine
    steps:
      - uses: actions/checkout@v7
      - name: Trust the checked out source in the container
        run: git config --global --add safe.directory "$PWD"
      - name: Install the application's pinned ANGLE headers
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y 7zip
          wget -q https://github.com/CKopoer/media-kit/releases/download/native-2026-11-07/ANGLE.7z
          echo 'cc5911bb15d596fd5a2b362613ad35b7093b427117269a7359054a65746a5f9a  ANGLE.7z' | sha256sum -c -
          7zz x ANGLE.7z -oangle
          cp -a angle/include/. "$FFBUILD_PREFIX/include/"
      - name: Build the pinned LGPL SDK
        run: ./ci/build-mingw64-full.sh
      - name: Record sources, configuration and licenses
        shell: bash
        run: |
          set -euo pipefail
          grep -E '^#define HAVE_EGL_ANGLE 1$' build/config.h
          grep -E '^#define HAVE_D3D_HWACCEL 1$' build/config.h
          mkdir -p artifact-libmpv/provenance/licenses
          git rev-parse HEAD > artifact-libmpv/provenance/mpv.commit
          for source in ffmpeg LuaJIT libsixel subrandr; do
            git -C "$source" rev-parse HEAD > "artifact-libmpv/provenance/$source.commit"
          done
          cp ffmpeg/ffbuild/config.log artifact-libmpv/provenance/ffmpeg-config.log
          cp build/meson-info/intro-buildoptions.json artifact-libmpv/provenance/
          cp build/meson-info/intro-dependencies.json artifact-libmpv/provenance/
          cp ci/build-mingw64-full.sh ci/build-common.sh .github/workflows/bilisail-windows.yml artifact-libmpv/provenance/
          while IFS= read -r -d '' notice; do
            relative="${notice#"$FFBUILD_PREFIX/share/"}"
            mkdir -p "artifact-libmpv/provenance/licenses/$(dirname "$relative")"
            cp "$notice" "artifact-libmpv/provenance/licenses/$relative"
          done < <(find "$FFBUILD_PREFIX/share" -type f \( -iname '*license*' -o -iname '*copying*' -o -iname '*copyright*' -o -iname '*authors*' -o -iname '*notice*' \) -print0)
          cp LICENSE.LGPL Copyright artifact-libmpv/provenance/
          cp ffmpeg/COPYING.LGPLv3 ffmpeg/COPYING.GPLv3 artifact-libmpv/provenance/
          find "$FFBUILD_PREFIX/share" -maxdepth 3 -type f > artifact-libmpv/provenance/toolchain-share-files.txt
          printf '%s\n' 'ghcr.io/btbn/ffmpeg-builds/win64-lgpl@sha256:291298c28290ea30b94a224cb2545d1f2df922fe9445d1866036eabbeb246a3f' > artifact-libmpv/provenance/container.txt
          find artifact-libmpv -type f -print0 | sort -z | xargs -0 sha256sum > sdk-sha256.txt
      - name: Package SDK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, zipfile
          root = pathlib.Path('artifact-libmpv')
          with zipfile.ZipFile('bilisail-libmpv-windows-x64.zip', 'w', compression=zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(root.rglob('*')):
                  if path.is_file():
                      archive.write(path, path.relative_to(root))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: bilisail-libmpv-windows-x64
          path: |
            bilisail-libmpv-windows-x64.zip
            sdk-sha256.txt
          if-no-files-found: error
      - name: Build a control with the original EGL mapper
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin 88eb9f2e73945d8bc9c133a2f67babaa9af34680
          git show 88eb9f2e73945d8bc9c133a2f67babaa9af34680:video/out/opengl/hwdec_d3d11egl.c > video/out/opengl/hwdec_d3d11egl.c
          meson compile -C build
          mkdir -p baseline-control
          cp build/libmpv-2.dll baseline-control/
          "${FFBUILD_CROSS_PREFIX}strip" baseline-control/libmpv-2.dll
          printf '%s\n' 'Same source, compiler and dependencies; hwdec_d3d11egl.c restored from 88eb9f2e73945d8bc9c133a2f67babaa9af34680. For regression comparison only.' > baseline-control/README.txt
      - uses: actions/upload-artifact@v7
        with:
          name: bilisail-libmpv-baseline-control
          path: baseline-control/
          if-no-files-found: error
      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bilisail-libmpv-build-logs
          path: |
            build/meson-logs/
            ffmpeg/ffbuild/config.log
          if-no-files-found: ignore
